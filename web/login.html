<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="/eel.js"></script>
  <title>Masuk · The Weeknd</title>
</head>
<body>
  <div id="site-nav"></div>
  <main class="page">
    <div class="auth">
      <div class="poster" role="img" aria-label="Poster After Hours Til Dawn">
        <small>XO &nbsp;/&nbsp; JAKARTA 2027</small>
        <p class="display poster-title">AFTER<br>HOURS<br>TIL DAWN</p>
        <small>THE WEEKND &nbsp;─&nbsp; LIVE EXPERIENCE</small>
      </div>
      <form class="card auth-card" id="login-form" novalidate>
        <p class="eyebrow">YOUR NIGHT STARTS HERE</p>
        <h1 class="display auth-title">SELAMAT DATANG.</h1>
        <p class="muted" style="font-size:14px">Masuk untuk membeli tiket dan melihat pesanan.</p>
        <div id="form-banner" class="banner" hidden></div>

        <div class="field" id="f-email">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="nama@email.com" autocomplete="email">
          <p class="help"></p>
        </div>
        <div class="field" id="f-password">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="input" id="password" type="password" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="eye" data-toggle="password" aria-label="Tampilkan password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <p class="help"></p>
        </div>

        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Masuk →</button>
        <a class="btn btn-outline btn-block" data-route="U2">Belum punya akun? Daftar sekarang</a>
        <p class="muted" style="font-size:12px">Data akunmu digunakan untuk penerbitan e-ticket.</p>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>document.addEventListener('DOMContentLoaded', initLogin);</script>
</body>
</html>
